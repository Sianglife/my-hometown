        height: 100%;

        max-width: 600px;
        margin-top: 20px;

<body>
    <main id="container">
        <header id="banner">
            <h2 class="banner-subtitle">My Hometown</h2>
            <h1 class="banner-title">板橋</h1>
            <p class="banner-content">從林家花園的庭院，到板橋車站周邊的高樓，板橋的不同面貌，記錄著一座城市如何成長。這裡曾是農業聚落、河運商埠與工業發展的基地，如今則是新北市的行政與交通中心。認識板橋，可以從它的歷史開始，也可以從街道、商圈與居民的日常走進來。</p>
        </header>
