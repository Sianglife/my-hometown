<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hometown - 板橋</title>
</head>

<style>
    body {
        margin: 0;
    }
    #container {
        display: flex;
        flex-direction: column;
        justify-content: flex-start; 
        min-width: 100vw;
        min-height: 100vh;
        position: relative;
        isolation: isolate;
        overflow: hidden;
    }

    #container::before {
        content: '';
        position: absolute;
        inset: -12px;
        z-index: -1;
        background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
            url('assets/banner.jpg') center / cover no-repeat;
        filter: blur(8px);
        pointer-events: none;
    }

    #banner {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        color: #e2cab5;
    }

    #banner h1 {
        color: #e2cab5;
    }

    img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .banner-content {
        max-width: 600px;
        margin-top: 20px;
        font-size: 1rem;
        line-height: 1.5;
        word-break: keep-all;
    }

    .banner-title {
        font-size: 4rem;
        margin: 3.5rem 0;
    }

    .banner-subtitle {
        font-size: 2rem;
        margin: 2.5rem 0;
    }

    .banner-nav-container {
        display: flex;
        margin-top: 1.5rem;
        justify-content: space-evenly;
        color: #867A69;
    }

    .banner-nav {
        text-decoration: none;
        font-size: 1.5rem;
        color: #c0b29f;
    }

</style>

<body>
    <main id="container">
        <header id="banner">
            <h2 class="banner-subtitle">My Hometown</h2>
            <h1 class="banner-title">板橋</h1>
            <p class="banner-content">從林家花園的庭院，到板橋車站周邊的高樓，板橋的不同面貌，記錄著一座城市如何成長。這裡曾是農業聚落、河運商埠與工業發展的基地，如今則是新北市的行政與交通中心。認識板橋，可以從它的歷史開始，也可以從街道、商圈與居民的日常走進來。</p>
        </header>

        <div class="banner-nav-container">
            <a class="banner-nav" href="history.html">板橋的故事</a>
            <a class="banner-nav" href="landmark.html">Landmark</a>
        </div>
    </main>
</body>

</html>
